<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; }
    .favicon {
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at 35% 30%, #0c2433 0%, #050708 75%);
      border-radius: 22%;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      box-shadow: inset 0 0 0 1.6vmin #14333a;
    }
    /* 0x7E = ASCII tilde = the XBee API start-delimiter byte */
    .glyph {
      font-family: 'JetBrains Mono', monospace; font-weight: 700;
      font-size: 60vmin; color: #5fe6c4;
      text-shadow: 0 0 8vmin rgba(95,230,196,0.65);
      line-height: 1; margin-top: -8vmin;
    }
  </style>
</head>
<body>
  <div class="favicon">
    <div class="glyph">~</div>
  </div>
</body>
</html>
